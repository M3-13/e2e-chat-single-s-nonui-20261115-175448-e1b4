[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "textutils"
version = "0.1.0"
description = "Small, dependency-free string helper functions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9.2,<10",
    "ruff>=0.17.5,<0.18",
]

[tool.setuptools]
packages = ["textutils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
